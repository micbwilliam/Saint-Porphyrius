name: Auto Release

# Watches main for a version bump in saint-porphyrius.php. When the version
# changes to one that has no tag yet, this tags it and hands off to release.yml,
# which builds the .zip and publishes the GitHub Release.
#
# Releasing is therefore just: bump the version, update CHANGELOG.md, push to main.
#
# Safe to run alongside a hand-pushed tag: if the tag already exists this exits
# without doing anything, and release.yml handles that tag via its `push: tags`
# trigger instead. Exactly one of the two paths ever creates the release.

on:
  push:
    branches: [main]
    paths:
      - 'saint-porphyrius.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Tag version bump
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and decide whether to tag
        id: check
        run: |
          HEADER_VERSION=$(grep -oP "Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+" saint-porphyrius.php | head -1)
          CONST_VERSION=$(grep -oP "SP_PLUGIN_VERSION.*?'\K[0-9]+\.[0-9]+\.[0-9]+" saint-porphyrius.php | head -1)

          if [ -z "$HEADER_VERSION" ]; then
            echo "::error::Could not read the version from the saint-porphyrius.php header."
            exit 1
          fi

          if [ "$HEADER_VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Plugin header ($HEADER_VERSION) and SP_PLUGIN_VERSION ($CONST_VERSION) disagree. Fix before releasing."
            exit 1
          fi

          TAG="v${HEADER_VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::${TAG} is already tagged — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The release notes come from CHANGELOG.md; refuse to ship an empty section.
          if ! grep -q "^## \[${HEADER_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${HEADER_VERSION}]' section. Add the release notes before bumping the version."
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  release:
    name: Publish
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
