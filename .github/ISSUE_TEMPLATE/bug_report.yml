name: 🐛 Bug Report
description: Report a bug in Saint Porphyrius
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in the details below.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the plugin is affected?
      options:
        - Authentication / Login
        - Registration / Pending Users
        - Dashboard
        - Events
        - Attendance / QR Check-in
        - Points / Leaderboard
        - Excuses
        - Forbidden / Discipline
        - Bus System
        - Quiz System
        - Push Notifications
        - In-App Notifications
        - Social Profiles
        - Point Sharing
        - Gamification
        - PWA / Service Worker
        - Admin Panel
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '/app/...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the issue.

  - type: dropdown
    id: device
    attributes:
      label: Device Type
      options:
        - Mobile (Android)
        - Mobile (iOS)
        - Tablet
        - Desktop
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "e.g. Chrome 120, Safari 17, Samsung Internet"

  - type: input
    id: wp-version
    attributes:
      label: WordPress Version
      placeholder: "e.g. 6.4"

  - type: input
    id: php-version
    attributes:
      label: PHP Version
      placeholder: "e.g. 8.1"

  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      placeholder: "e.g. 5.0.0"

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Any relevant entries from `wp-content/debug.log` or browser console.
      render: shell
